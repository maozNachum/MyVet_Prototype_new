name: MyVet CI

on:
  pull_request:
  push:
    branches: [Full_Demo, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.2
      - run: npm ci
      - run: npm run typecheck:ai
      - run: npm run typecheck:edge
      - run: npm run test:appointments
      - run: npm run test:document-ocr
      - run: npm run test:frontend-secrets
      - run: npm run test:vetbot
      - run: npm run build
      - run: git diff --check
